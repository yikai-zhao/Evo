services:
  - type: web
    name: evo
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
    disk:
      name: evo-data
      mountPath: /var/data
      sizeGB: 1
    autoDeploy: true
